controller_manager:
  ros__parameters:
    update_rate: 125  # Hz, = the drives' interpolation period (cycle_ms 8)
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints: [arm_1_joint, arm_2_joint, arm_3_joint, arm_4_joint, arm_5_joint, arm_6_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.02
      goal_time: 3.0
      arm_1_joint: {trajectory: 0.14, goal: 0.01}
      arm_2_joint: {trajectory: 0.14, goal: 0.01}
      arm_3_joint: {trajectory: 0.14, goal: 0.01}
      arm_4_joint: {trajectory: 0.14, goal: 0.01}
      arm_5_joint: {trajectory: 0.14, goal: 0.01}
      arm_6_joint: {trajectory: 0.14, goal: 0.01}
